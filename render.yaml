services:
  # 1. FastAPI Persistent Python AI Backend Service
  - type: web
    name: chatlens-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MAX_FILE_SIZE_MB
        value: 50

  # 2. React Vite Frontend Static Site
  - type: web
    name: chatlens-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
